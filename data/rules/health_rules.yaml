# Health rules and signal thresholds (MVP spec §7.1 step 5, §7.2). Values are synthetic calibration choices.
version: 1
signals:
  cpu_busy_high: {threshold: 90.0, for_s: 30}
  latency_out_of_band: {for_s: 30}
  sc_queue: {threshold: 5, for_s: 30}
  sc_at_max: {for_s: 10}
  audit_fill_high: {threshold: 70.0}
  audit_fill_rising: {per_min: 0.5, window_s: 300}
  link_errors: {min_count: 5, window_s: 120}
  clear_after_s: 120          # event-driven signals clear after this long without events
states:
  cpu:
    down: "cpu.up == 0"
    critical: {busy_gte: 95.0, for_s: 60}
    degraded: {busy_gte: 80.0}
  server_class:
    critical: "queued > 0 and (running == max or service p95 above target)"
    degraded: "queued > 0 or running == max"
  tmf:
    critical: {fill_gte: 80.0}
    degraded: {fill_gte: 70.0}
  service:
    critical: "p95 above target (or above band and timeouts >= 1%)"
    degraded: "p95 above band"
n1:
  every_s: 5
  threshold: 90.0
latency_band: [0.8, 1.4]
