id: tacl.status_cpu
title: Processes on a CPU
utility: TACL
interpreter: null
template: STATUS *, CPU {cpu}
description: Lists the processes running in one processor with their priority and busy share.
tier: T0
params:
  cpu:
    type: cpu
    min: 0
    max: 7
    state: up
