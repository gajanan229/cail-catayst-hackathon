# Simulated syntax modeled on HPE utilities; verify against the manuals (MVP spec Appendix D).
id: scf.status_disk
title: Disk path status
utility: SCF
interpreter: SCF
template: STATUS DISK {volume}
description: Path state of both mirror halves of a disk volume.
tier: T0
params:
  volume:
    type: volume
    source: inventory.volumes
parser: scf_status_disk
facts: Path states of both halves
examples:
- utterance: status of disk $DATA02
  params:
    volume: $DATA02
- utterance: are the mirrors of $DATA01 up
  params:
    volume: $DATA01
aliases:
- disk status
- status disk
- mirror
- volume status
- disk path
doc_refs:
- label: Operator Messages ch. 68 (OMF)
  url: https://ftp.hp.com/pub/softlib/NonStopOpMsgsMnl/ch68.html
syntax_status: simulated
reversible: false
undo: null
preconditions: []
side_effects: None (read-only)
risks: Read-only; negligible load
param_class: any
internal: false
